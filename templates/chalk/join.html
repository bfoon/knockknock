{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<title>Open a board · Chalk</title>
<link rel="stylesheet" href="{% static 'chalk/css/chalk.css' %}?v=2">
</head>
<body class="chalk-page">
<div class="join-wrap">

  <p class="kicker">Chalk</p>
  <h1 class="join-title">Type the number on the screen</h1>

  <form method="post" action="{% url 'chalk:join' %}">
    {% csrf_token %}
    <input id="code-input" name="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="12"
           autocomplete="one-time-code" autofocus value="{{ code }}"
           aria-label="Board number"
           {% if error %}aria-invalid="true" aria-describedby="join-error"{% endif %}>
    {% if error %}<p class="join-error" id="join-error" role="alert">{{ error }}</p>{% endif %}
    <button class="btn btn-primary join-submit" type="submit">Open the board</button>
  </form>

</div>
</body>
</html>
