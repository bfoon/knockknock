{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16140f">
<title>Controller · enter code</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Archivo:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* Self-contained on purpose: this screen is what a presenter meets on a
   phone, on someone else's wifi, thirty seconds before they start. It
   should not depend on any other file arriving. */
:root{
  --ink:#16140f; --ink-2:#211e18; --ink-3:#2c281f; --line:#3a352a;
  --cream:#fbf8f1; --fog:#a59c88; --fog-2:#cfc6b2;
  --signal:#e8482b; --signal-2:#ff6a4d; --ok:#5b8c5a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:grid;place-items:center;padding:1.4rem;
  background:radial-gradient(760px 460px at 70% -10%,#2c281f 0%,transparent 62%),var(--ink);
  color:var(--cream);
  font:400 16px/1.55 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:min(400px,100%);
  background:var(--ink-2);border:1px solid var(--line);
  border-radius:20px;padding:2rem 1.7rem;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.eyebrow{
  font:600 11px/1 "Archivo",sans-serif;letter-spacing:.14em;
  color:var(--signal);margin:0 0 .55rem;
}
h1{
  margin:0 0 .5rem;font-family:"Fraunces",Georgia,serif;font-weight:600;
  font-size:1.6rem;line-height:1.2;letter-spacing:-.01em;
}
.deck{
  margin:0 0 1.5rem;color:var(--fog);font-size:.92rem;
  overflow-wrap:anywhere;
}
label{display:block;font-size:.85rem;color:var(--fog-2);margin-bottom:.45rem}
input[type="text"]{
  width:100%;padding:.85rem 1rem;border-radius:13px;
  background:var(--ink);border:1px solid var(--line);color:var(--cream);
  font:600 1.5rem/1.1 "Spline Sans Mono",ui-monospace,monospace;
  letter-spacing:.42em;text-align:center;
}
input[type="text"]::placeholder{color:#5c5647;letter-spacing:.42em}
input[type="text"]:focus{outline:none;border-color:var(--signal)}
button{
  width:100%;margin-top:.85rem;padding:.85rem 1rem;border-radius:13px;
  border:1px solid var(--signal);background:var(--signal);color:#fff;
  font:600 1rem/1 "Archivo",sans-serif;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
button:hover{background:var(--signal-2);border-color:var(--signal-2)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.msg{
  margin-top:.9rem;min-height:1.3rem;font-size:.88rem;color:var(--fog);
}
.msg.bad{color:#fca5a5}
.msg.good{color:#a7d3a5}
.hint{
  margin:1.5rem 0 0;padding-top:1.1rem;border-top:1px solid var(--line);
  color:var(--fog);font-size:.82rem;
}
</style>
</head>
<body>

<main class="card">
  <p class="eyebrow">PRESENTER CONTROLLER</p>
  <h1>Enter your code</h1>
  <p class="deck">{{ deck_title }}</p>

  <label for="pin">Six-digit controller code</label>
  <input type="text" id="pin" inputmode="numeric" autocomplete="one-time-code"
         pattern="[0-9]*" maxlength="6" placeholder="000000"
         aria-describedby="msg"{% if locked_out %} disabled{% endif %}>
  <button id="go" type="button"{% if locked_out %} disabled{% endif %}>Unlock</button>

  <p class="msg{% if locked_out %} bad{% endif %}" id="msg" role="status" aria-live="polite">
    {% if locked_out %}Too many attempts. Wait ten minutes and try again.{% endif %}
  </p>

  <p class="hint">The code is on your presenter screen, under the controller
    button. It is not the join code the room scans.</p>
</main>

<script>
(function(){
  "use strict";
  var url = "{{ unlock_url }}";
  var pin = document.getElementById("pin");
  var go  = document.getElementById("go");
  var msg = document.getElementById("msg");
  var busy = false;

  function csrf(){
    var m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : "";
  }
  function say(text, kind){
    msg.textContent = text || "";
    msg.className = "msg" + (kind ? " " + kind : "");
  }

  function submit(){
    if(busy || go.disabled) return;
    var value = (pin.value || "").replace(/\D/g, "");
    if(value.length < 4){ say("Enter the code from your presenter screen.", "bad"); return; }

    busy = true; go.disabled = true; say("Checking…");
    fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-CSRFToken": csrf()
      },
      credentials: "same-origin",
      body: "pin=" + encodeURIComponent(value)
    }).then(function(r){
      return r.json().then(function(j){ return {status: r.status, body: j}; });
    }).then(function(res){
      var j = res.body || {};
      if(j.ok){
        say("Unlocked. Opening the controller…", "good");
        window.location.reload();
        return;
      }
      say(j.error || "That code is not right.", "bad");
      if(j.locked){
        pin.disabled = true;
        return;                       // stay disabled until the wait is over
      }
      if(typeof j.tries_left === "number" && j.tries_left <= 3){
        say((j.error || "That code is not right.") +
            " " + j.tries_left + " attempt" + (j.tries_left === 1 ? "" : "s") + " left.", "bad");
      }
      pin.value = ""; pin.focus();
      busy = false; go.disabled = false;
    }).catch(function(){
      say("Could not reach the server. Check the connection and try again.", "bad");
      busy = false; go.disabled = false;
    });
  }

  go.addEventListener("click", submit);
  pin.addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); });
  pin.addEventListener("input", function(){
    pin.value = pin.value.replace(/\D/g, "").slice(0, 6);
    if(msg.className.indexOf("bad") > -1 && pin.value) say("");
    if(pin.value.length === 6) submit();   // no extra tap once it is complete
  });
  if(!pin.disabled) pin.focus();
})();
</script>
</body>
</html>
