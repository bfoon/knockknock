name: kura_collect
description: Kura Collect offline-first Android data collection app for nokknock.app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  signature: ^5.5.0
  intl: ^0.20.1
  workmanager: ^0.9.0
  shared_preferences: ^2.3.3
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0830"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true