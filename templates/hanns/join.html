{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>React · {{ deck.title }} · Hanns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Archivo:wght@400;600;700;800&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050616;
    --bg2:#090b23;
    --panel:rgba(255,255,255,.085);
    --panel2:rgba(255,255,255,.135);
    --line:rgba(255,255,255,.14);
    --text:#f8fbff;
    --muted:rgba(248,251,255,.68);
    --dim:rgba(248,251,255,.45);
    --cyan:#22d3ee;
    --orange:#ff8a1f;
    --pink:#ff3f98;
    --green:#22c55e;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;min-height:100%;background:var(--bg);}
  body{
    color:var(--text);
    font-family:"Archivo",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    touch-action:manipulation;
    overflow:hidden;
  }

  /* Clean phone-first layout: no inner card, no fake second screen.
     Top info stays compact and the reaction pad gets most of the viewport. */
  .phone-screen{
    width:100vw;
    height:100vh;
    height:100dvh;
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    gap:10px;
    padding:
      max(10px,env(safe-area-inset-top))
      max(10px,env(safe-area-inset-right))
      max(10px,env(safe-area-inset-bottom))
      max(10px,env(safe-area-inset-left));
    overflow:hidden;
    position:relative;
    isolation:isolate;
    background:
      radial-gradient(820px 460px at 86% -12%,rgba(255,138,31,.22),transparent 60%),
      radial-gradient(740px 480px at -6% 2%,rgba(139,92,246,.32),transparent 58%),
      radial-gradient(620px 380px at 55% 110%,rgba(34,211,238,.16),transparent 60%),
      linear-gradient(135deg,var(--bg),var(--bg2) 52%,#160a2c);
  }
  .phone-screen::before{
    content:"";position:absolute;inset:-20%;z-index:-1;pointer-events:none;opacity:.42;
    background-image:
      radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.9),transparent),
      radial-gradient(1px 1px at 36% 72%,rgba(34,211,238,.8),transparent),
      radial-gradient(1px 1px at 62% 18%,rgba(255,255,255,.7),transparent),
      radial-gradient(1px 1px at 82% 70%,rgba(255,63,152,.75),transparent),
      radial-gradient(1px 1px at 92% 30%,rgba(255,255,255,.85),transparent);
    background-size:220px 220px;
    animation:stars 24s linear infinite;
  }

  .top-panel{
    min-width:0;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:8px;
    padding:12px 12px 10px;
    border:1px solid var(--line);
    border-radius:22px;
    background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.045));
    box-shadow:0 18px 48px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }

  .brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;}
  .mark{
    flex:0 0 auto;
    font-weight:900;
    font-size:.98rem;
    letter-spacing:-.02em;
    background:linear-gradient(110deg,#fff 8%,var(--orange) 36%,var(--pink) 64%,var(--cyan) 95%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .mark .dot{-webkit-text-fill-color:var(--pink);color:var(--pink)}
  .status{
    flex:0 0 auto;
    display:inline-flex;align-items:center;gap:6px;
    min-height:24px;
    padding:4px 9px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.055);
    color:var(--muted);
    font:700 .62rem/1 "Spline Sans Mono",ui-monospace,monospace;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .dot-i{width:8px;height:8px;border-radius:999px;background:#64748b;flex:0 0 auto;transition:.2s;}
  .dot-i.on{background:var(--green);box-shadow:0 0 10px rgba(34,197,94,.88)}

  h1{
    min-width:0;
    max-width:100%;
    margin:0;
    font:600 clamp(1.05rem,4.2vw,1.42rem)/1.08 "Fraunces",serif;
    letter-spacing:-.025em;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .meta-row{
    min-width:0;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:8px;
  }
  .code,
  .pad-msg{
    min-width:0;
    min-height:28px;
    display:inline-flex;
    align-items:center;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    background:rgba(255,255,255,.058);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .code{
    justify-self:start;
    max-width:100%;
    gap:7px;
    padding:5px 10px;
    color:var(--muted);
    font:700 .64rem/1 "Spline Sans Mono",ui-monospace,monospace;
    letter-spacing:.08em;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .code strong{
    color:var(--cyan);
    letter-spacing:.18em;
    font-size:.82rem;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pad-msg{
    justify-self:end;
    max-width:100%;
    gap:5px;
    margin:0;
    padding:5px 10px;
    color:rgba(248,251,255,.75);
    font:800 .68rem/1 "Archivo",system-ui,sans-serif;
    line-height:1;
    text-align:right;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pad-msg::before{content:"👆";font-size:.78rem;line-height:1;flex:0 0 auto;}

  .reaction-area{min-height:0;position:relative;display:grid;overflow:hidden;}
  .pad{
    width:100%;height:100%;min-height:0;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr));
    gap:10px;
  }
  .pad.disabled{opacity:.42;pointer-events:none;filter:grayscale(.2)}
  .react{
    width:100%;height:100%;min-width:0;min-height:0;
    display:grid;place-items:center;
    padding:0;margin:0;
    border:1px solid var(--line);
    border-radius:20px;
    background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
    box-shadow:0 14px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.10);
    color:#fff;
    font-size:clamp(2rem,8.2dvh,3.25rem);
    line-height:1;
    cursor:pointer;
    transition:transform .08s ease,background .12s ease,border-color .12s ease;
  }
  .react:active{
    transform:scale(.9);
    border-color:rgba(34,211,238,.58);
    background:linear-gradient(135deg,rgba(255,138,31,.26),rgba(255,63,152,.22));
  }

  footer{
    text-align:center;
    color:var(--dim);
    font:700 .6rem/1 "Spline Sans Mono",ui-monospace,monospace;
    letter-spacing:.06em;
    white-space:nowrap;
  }

  #burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .burst-em{position:absolute;bottom:30%;font-size:2.4rem;animation:bz 1.1s ease-out forwards}

  @keyframes bz{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-20px) scale(1.2)}100%{transform:translateY(-180px) scale(.8);opacity:0}}
  @keyframes stars{to{transform:translate3d(-90px,70px,0)}}

  /* Short phones: keep the pad large and hide anything non-essential. */
  @media (max-height:650px){
    .phone-screen{gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));}
    .top-panel{padding:9px 10px;border-radius:18px;gap:6px;}
    h1{font-size:1rem;}
    .meta-row{gap:6px;}
    .code,.pad-msg{min-height:24px;padding:4px 8px;}
    .code{font-size:.56rem;}
    .code strong{font-size:.72rem;}
    .pad-msg{font-size:.6rem;}
    .status{font-size:.56rem;min-height:22px;padding:3px 8px;}
    .pad{gap:8px;}
    .react{border-radius:16px;font-size:clamp(1.65rem,8.4dvh,2.45rem);}
    footer{font-size:.54rem;}
  }

  /* Very narrow phones: stack the info row cleanly, then use 4×3 so
     reaction buttons do not become tall skinny blocks. */
  @media (max-width:360px){
    .meta-row{grid-template-columns:1fr;gap:6px;}
    .code,.pad-msg{justify-self:stretch;justify-content:center;text-align:center;}
    .pad-msg{font-size:.64rem;}
  }
  @media (max-width:340px){
    .pad{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;}
    .react{font-size:clamp(1.45rem,7.5dvh,2.2rem);border-radius:15px;}
  }

  /* Landscape phones: compact left info, large reaction area on the right. */
  @media (orientation:landscape) and (max-height:520px){
    .phone-screen{grid-template-columns:minmax(210px,.75fr) minmax(320px,1.25fr);grid-template-rows:minmax(0,1fr) auto;gap:10px;}
    .top-panel{grid-column:1;grid-row:1;align-self:stretch;align-content:start;}
    .reaction-area{grid-column:2;grid-row:1 / span 2;}
    footer{grid-column:1;grid-row:2;text-align:left;padding-left:4px;}
    .meta-row{display:grid;grid-template-columns:1fr;gap:8px;}
    .code,.pad-msg{justify-self:start;}
    .pad-msg{text-align:left;}
    .pad{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));}
    .react{font-size:clamp(1.5rem,12dvh,2.5rem);}
  }

  @media (prefers-reduced-motion:reduce){.phone-screen::before,.burst-em{animation:none!important;}}
</style>
</head>
<body>
<div class="phone-screen" aria-label="Hanns live reaction pad">
  <section class="top-panel">
    <div class="brand-row">
      <span class="mark">Hanns<span class="dot">.</span></span>
      <div class="status"><span class="dot-i" id="dot"></span><span>Live</span></div>
    </div>

    <h1 id="join-title" title="{{ deck.title|escape }}">{% if deck.title|length > 26 %}{{ deck.title|slice:":26" }}....{% else %}{{ deck.title }}{% endif %}</h1>

    <div class="meta-row">
      <div class="code">CODE · <strong id="join-code">{{ deck.code }}</strong></div>
      <p class="pad-msg" id="pad-msg">Tap an emoji</p>
    </div>
  </section>

  <main class="reaction-area">
    <div class="pad" id="pad"></div>
    <div id="burst"></div>
  </main>

  <footer>Powered by Hanns · KnockKnock</footer>
</div>

<script>
  window.__HANNS_JOIN__ = {
    wsUrl: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/hanns/{{ deck.code }}/",
    code: "{{ deck.code }}",
    title: "{{ deck.title|escapejs }}",
    reactions: ["❤️","👏","🔥","😂","😮","💯","🎉","👍","✨","🙌","🤯","💜"]
  };
</script>
<script src="{% static 'hanns/js/hanns_join.js' %}?v=4"></script>
</body>
</html>
