{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Controller · {{ deck.title }} · Hanns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'hanns/css/hanns.css' %}?v=6">
</head>
<body class="phone-control">
  <main class="phone-card">
    <div class="phone-status" id="status">ENTER PIN TO CONNECT</div>
    <h1>{{ deck.title }}</h1>
    <div class="phone-slide-title" id="slide-title">Slide 1</div>
    <div class="pin-row" id="pin-row">
      <input id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="PIN">
      <button id="connect" type="button">Connect</button>
    </div>
    <div class="phone-controls" id="controls" hidden>
      <button id="prev" type="button">‹</button>
      <button id="next" type="button">›</button>
    </div>
    <button class="phone-btn" id="toggle-notes" type="button" hidden>Show / hide presenter notes</button>
    <section class="phone-notes" id="notes" hidden>No notes for this slide.</section>
  </main>
<script>
window.__HANNS_CONTROL__ = {
  deck: {{ deck_json|safe }},
  wsUrl: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/hanns/{{ deck.code }}/"
};
</script>
<script>
(function(){
"use strict";
const CFG=window.__HANNS_CONTROL__||{};const D=CFG.deck||{slides:[],current_slide:0};
const $=s=>document.querySelector(s);let i=D.current_slide||0;let sock=null;let connected=false;
function params(){return new URLSearchParams(location.search)}
function setStatus(t){$("#status").textContent=t;}
function render(){const s=D.slides[i]||{};$("#slide-title").textContent=`Slide ${i+1} / ${D.slides.length||1}`;$("#notes").textContent=s.notes||"No presenter notes for this slide.";}
function send(o){if(sock&&sock.readyState===1)sock.send(JSON.stringify(o));}
function connect(){const pin=$("#pin").value.trim();if(!pin){setStatus("ENTER THE PIN SHOWN ON THE PRESENTER SCREEN");return;}sock=new WebSocket(CFG.wsUrl);sock.addEventListener("open",()=>send({type:"controller_hello",pin}));sock.addEventListener("message",ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.type==="controller_ok"){connected=true;i=Number(m.current_slide)||i;$("#pin-row").hidden=true;$("#controls").hidden=false;$("#toggle-notes").hidden=false;setStatus("CONNECTED · PHONE CONTROLLER READY");render();}else if(m.type==="controller_denied"){setStatus("WRONG PIN");try{sock.close()}catch(e){}}else if(m.type==="goto"&&typeof m.index==="number"){i=Math.max(0,Math.min(m.index,D.slides.length-1));render();}});sock.addEventListener("close",()=>{if(connected)setStatus("DISCONNECTED · TAP CONNECT AGAIN");});}
function go(n){if(!connected)return;i=Math.max(0,Math.min(n,D.slides.length-1));render();send({type:"goto",index:i});}
$("#connect").addEventListener("click",connect);$("#prev").addEventListener("click",()=>go(i-1));$("#next").addEventListener("click",()=>go(i+1));$("#toggle-notes").addEventListener("click",()=>{$("#notes").hidden=!$("#notes").hidden;});
const qp=params().get("pin");if(qp){$("#pin").value=qp;setTimeout(connect,250);}render();
})();
</script>
</body>
</html>
