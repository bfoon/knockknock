<!--{# Standalone page rendered inside the agenda editor's iframe.-->
<!--   Intentionally does NOT extend base.html — we want a clean, minimal-->
<!--   render with just the agenda block and the kk-* design vars. #}-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agenda preview · {{ event.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Re-declare the same design tokens the rest of the app uses, so the
       included _agenda_styles partials look identical to how they'd look
       in a real ticket / event page. */
    :root {
      --kk-bg:        #0b1120;
      --kk-surface:   #111827;
      --kk-surface-2: #1e293b;
      --kk-border:    rgba(148, 163, 184, 0.18);
      --kk-text:      #f1f5f9;
      --kk-text-dim:  #94a3b8;
      --kk-radius:    12px;
    }
    html, body {
      margin: 0; padding: 0;
      background: var(--kk-bg);
      color: var(--kk-text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    body { padding: 1rem; }
    .kk-pv-empty {
      text-align: center; padding: 3rem 1rem; color: var(--kk-text-dim);
    }
    .kk-pv-empty i { font-size: 2.5rem; display: block; margin-bottom: .75rem; opacity: .55; }
    .kk-pv-empty p { margin: 0; font-size: .9rem; }
    .kk-text-dim { color: var(--kk-text-dim) !important; }
    .small { font-size: .85em; }
    /* Tame margins of fallback freeform text. */
    .kk-agenda-fallback p { margin: 0 0 .75rem; }
  </style>
</head>
<body>
  {% if event.agenda_items.exists or event.agenda %}
    {% include "attendance/_agenda.html" with event=event %}
  {% else %}
    <div class="kk-pv-empty">
      <i class="bi bi-calendar3"></i>
      <p>No sessions yet — add one and it'll appear here.</p>
    </div>
  {% endif %}
</body>
</html>
