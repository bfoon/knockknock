name: Build Kura Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths:
      - "kura/mobile/kura_collect_flutter/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: kura-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_PROJECT: kura/mobile/kura_collect_flutter
  KURA_BASE_URL: https://nokknock.app

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show commit and repository
        shell: bash
        run: |
          set -e

          echo "Commit being built:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Flutter project:"
          echo "$FLUTTER_PROJECT"

          if [ ! -d "$FLUTTER_PROJECT" ]; then
            echo "::error::Flutter project directory does not exist: $FLUTTER_PROJECT"
            find . -maxdepth 5 -name pubspec.yaml -print
            exit 1
          fi

          if [ ! -f "$FLUTTER_PROJECT/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml was not found in $FLUTTER_PROJECT"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show installed versions
        run: |
          java -version
          flutter --version
          dart --version

      - name: Verify Flutter project structure
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          set -e

          echo "Current working directory:"
          pwd

          echo
          echo "Project files:"
          ls -la

          echo
          echo "Android files:"
          find android -maxdepth 4 -type f | sort

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -d android/app
          test -f android/settings.gradle

      - name: Verify sync service type fix
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          set -e

          FILE="lib/core/services/sync_service.dart"

          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE does not exist."
            exit 1
          fi

          echo "Relevant sync service lines:"
          grep -nE "grouped|syncBatch|List<LocalSubmission>|List<dynamic>" \
            "$FILE" || true

          if ! grep -qE \
            "Map<String,[[:space:]]*List<LocalSubmission>>[[:space:]]+grouped" \
            "$FILE"; then
            echo "::error::The grouped submissions map is not typed as Map<String, List<LocalSubmission>>."
            echo
            echo "Required Dart declaration:"
            echo "final Map<String, List<LocalSubmission>> grouped ="
            echo "    <String, List<LocalSubmission>>{};"
            exit 1
          fi

          if grep -qE \
            "Map<String,[[:space:]]*List<dynamic>>[[:space:]]+grouped|<String,[[:space:]]*List<dynamic>>" \
            "$FILE"; then
            echo "::error::The sync service still declares grouped submissions as List<dynamic>."
            exit 1
          fi

          echo "Sync service type declaration is correct."

      - name: Verify Android Gradle Plugin
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          set -e

          echo "android/settings.gradle:"
          cat android/settings.gradle

          echo
          echo "Searching for Android Gradle Plugin 8.7.3:"

          if grep -RIn \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            --exclude="*.backup" \
            --exclude="*.bak" \
            "8\.7\.3" \
            android; then
            echo "::error::Android Gradle Plugin 8.7.3 still exists in the committed Android project."
            exit 1
          fi

          if ! grep -q \
            'id "com.android.application" version "8.11.1" apply false' \
            android/settings.gradle; then
            echo "::error::AGP 8.11.1 was not found in android/settings.gradle."
            exit 1
          fi

          if ! grep -q \
            'id "org.jetbrains.kotlin.android" version "2.2.20" apply false' \
            android/settings.gradle; then
            echo "::error::Kotlin plugin 2.2.20 was not found in android/settings.gradle."
            exit 1
          fi

          echo "Android plugin versions are correct."

      - name: Verify Gradle wrapper
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          set -e

          WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER_FILE" ]; then
            echo "::error::$WRAPPER_FILE is missing."
            echo "Commit the Gradle wrapper files before building."
            exit 1
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::android/gradle/wrapper/gradle-wrapper.jar is missing."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew is missing."
            exit 1
          fi

          echo "Gradle wrapper configuration:"
          cat "$WRAPPER_FILE"

          if ! grep -q \
            "gradle-8\.13-" \
            "$WRAPPER_FILE"; then
            echo "::error::The Gradle wrapper is not configured for Gradle 8.13."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Clear project build caches
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: Get Flutter dependencies
        working-directory: kura/mobile/kura_collect_flutter
        run: flutter pub get

      - name: Run Flutter analysis
        working-directory: kura/mobile/kura_collect_flutter
        continue-on-error: true
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No Flutter tests were found."
          fi

      - name: Show resolved Gradle version
        working-directory: kura/mobile/kura_collect_flutter/android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build release APK
        working-directory: kura/mobile/kura_collect_flutter
        run: |
          flutter build apk \
            --release \
            --dart-define=KURA_BASE_URL=https://nokknock.app

      - name: Build release Android App Bundle
        working-directory: kura/mobile/kura_collect_flutter
        run: |
          flutter build appbundle \
            --release \
            --dart-define=KURA_BASE_URL=https://nokknock.app

      - name: Verify generated files
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          set -e

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not created at $APK_PATH"
            exit 1
          fi

          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::AAB was not created at $AAB_PATH"
            exit 1
          fi

          ls -lh "$APK_PATH"
          ls -lh "$AAB_PATH"

      - name: Prepare artifacts
        working-directory: kura/mobile/kura_collect_flutter
        shell: bash
        run: |
          set -e

          mkdir -p github-artifacts

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            github-artifacts/kura-collect-release.apk

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            github-artifacts/kura-collect-release.aab

          {
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Domain: $KURA_BASE_URL"
            echo "Flutter project: $FLUTTER_PROJECT"
            echo "Built: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > github-artifacts/build-information.txt

          sha256sum \
            github-artifacts/kura-collect-release.apk \
            github-artifacts/kura-collect-release.aab \
            > github-artifacts/SHA256SUMS.txt

          ls -lh github-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kura-collect-apk
          path: |
            kura/mobile/kura_collect_flutter/github-artifacts/kura-collect-release.apk
            kura/mobile/kura_collect_flutter/github-artifacts/SHA256SUMS.txt
            kura/mobile/kura_collect_flutter/github-artifacts/build-information.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kura-collect-aab
          path: |
            kura/mobile/kura_collect_flutter/github-artifacts/kura-collect-release.aab
            kura/mobile/kura_collect_flutter/github-artifacts/SHA256SUMS.txt
            kura/mobile/kura_collect_flutter/github-artifacts/build-information.txt
          if-no-files-found: error
          retention-days: 30