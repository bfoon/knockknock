{% extends "base.html" %}
{% block title %}Check-in not open · {{ event.title }}{% endblock %}
{% block content %}
<div class="kk-public-wrap">
  <div class="kk-public-card text-center">
    <div class="kk-empty">
      <div class="em">🕐</div>
      <h2 class="mb-2">Check-in isn't open yet</h2>
      <p class="kk-text-dim mb-0">
        {{ event.title }} opens for check-in 2 hours before the event starts
        ({{ event.starts_at|date:"D j M · H:i" }}).
      </p>
    </div>
  </div>
</div>
{% endblock %}
