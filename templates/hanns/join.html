{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>React · {{ deck.title }} · Hanns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Archivo:wght@400;600;700&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16140f;--ink2:#211e18;--line:#3a352a;--paper:#f6f1e7;--fog:#a59c88;--signal:#e8482b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(120% 60% at 50% -10%,#2a2418 0%,transparent 60%),var(--ink);
    color:var(--paper);font-family:"Archivo",sans-serif;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  header{padding:1.4rem 1.2rem .8rem;text-align:center}
  .mark{font-family:"Archivo",sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
  .mark .dot{color:var(--signal)}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:1.6rem;margin:.6rem 0 .15rem;line-height:1.1}
  .code{font-family:"Spline Sans Mono",monospace;color:var(--fog);font-size:.8rem;letter-spacing:.22em}
  .status{display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;color:var(--fog);margin-top:.5rem}
  .dot-i{width:8px;height:8px;border-radius:50%;background:#5b5345;transition:.2s}
  .dot-i.on{background:#5b8c5a;box-shadow:0 0 8px #5b8c5a}
  .pad-msg{color:var(--fog);font-size:.82rem;text-align:center;padding:0 1.4rem;margin:.2rem 0 1rem;line-height:1.5}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 1rem 1.4rem;position:relative}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;width:100%;max-width:360px}
  .pad.disabled{opacity:.4;pointer-events:none}
  .react{background:var(--ink2);border:1px solid var(--line);border-radius:18px;
    font-size:2.4rem;padding:.7rem 0;cursor:pointer;transition:.1s;-webkit-tap-highlight-color:transparent}
  .react:active{transform:scale(.9);background:#2c281f}
  #burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .burst-em{position:absolute;bottom:30%;font-size:2.4rem;animation:bz 1.1s ease-out forwards}
  @keyframes bz{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-20px) scale(1.2)}100%{transform:translateY(-180px) scale(.8);opacity:0}}
  footer{text-align:center;padding:.6rem 1rem 1.2rem;color:#6b6354;font-size:.66rem;font-family:"Spline Sans Mono",monospace}

  /* Knock-Knock flyer alignment */
  body{background:radial-gradient(900px 560px at 86% -8%,rgba(255,138,31,.23),transparent 60%),radial-gradient(780px 520px at 5% 5%,rgba(139,92,246,.34),transparent 60%),radial-gradient(620px 420px at 60% 110%,rgba(34,211,238,.14),transparent 60%),linear-gradient(135deg,#050616,#090b23 45%,#160a2c)!important;color:#f8fbff!important}.mark,h1{background:linear-gradient(110deg,#fff 8%,#ff8a1f 36%,#ff3f98 64%,#22d3ee 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.mark .dot{-webkit-text-fill-color:#ff3f98;color:#ff3f98}.code{color:#22d3ee}.react{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-color:rgba(255,255,255,.13);box-shadow:0 18px 42px rgba(0,0,0,.25)}.react:active{background:linear-gradient(135deg,rgba(255,138,31,.25),rgba(255,63,152,.22))}

</style>
</head>
<body>
<header>
  <span class="mark">Hanns<span class="dot">.</span></span>
  <h1 id="join-title">{{ deck.title }}</h1>
  <div class="code">CODE · <span id="join-code">{{ deck.code }}</span></div>
  <div class="status"><span class="dot-i" id="dot"></span><span>live reactions</span></div>
</header>

<p class="pad-msg" id="pad-msg">Tap to react — your reaction floats up on the big screen.</p>

<main>
  <div class="pad" id="pad"></div>
  <div id="burst"></div>
</main>

<footer>Powered by Hanns · KnockKnock</footer>

<script>
  window.__HANNS_JOIN__ = {
    wsUrl: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/hanns/{{ deck.code }}/",
    code: "{{ deck.code }}",
    title: "{{ deck.title|escapejs }}",
    reactions: ["❤️","👏","🔥","😂","😮","💯","🎉","👍","✨","🙌","🤯","💜"]
  };
</script>
<script src="{% static 'hanns/js/hanns_join.js' %}?v=1"></script>
</body>
</html>
