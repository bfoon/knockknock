{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KnockKnock Cards{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Shadows+Into+Light&family=Patrick+Hand&family=Kalam:wght@400;700&family=Gochi+Hand&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'cards/css/cards.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="eo-body">
  {% if messages %}
    <div class="eo-flash-wrap">
      {% for message in messages %}
        <div class="eo-flash eo-flash--{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
