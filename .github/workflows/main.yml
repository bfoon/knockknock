name: Build Kura Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths:
      - "**/*.dart"
      - "**/pubspec.yaml"
      - "**/pubspec.lock"
      - "**/android/**"
      - ".github/workflows/build-kura-android.yml"

permissions:
  contents: read

concurrency:
  group: kura-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show installed versions
        run: |
          java -version
          flutter --version
          dart --version

      - name: Find Flutter project
        id: find_flutter
        shell: bash
        run: |
          set -e

          echo "Repository root:"
          pwd

          echo
          echo "Searching for Flutter projects..."

          mapfile -t PUBSPEC_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name pubspec.yaml \
              -not -path "*/.pub-cache/*" \
              -not -path "*/build/*"
          )

          if [ "${#PUBSPEC_FILES[@]}" -eq 0 ]; then
            echo "::error::No pubspec.yaml file was found in the repository."
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found pubspec files:"
          printf '%s\n' "${PUBSPEC_FILES[@]}"

          FLUTTER_DIR=""

          # Prefer the expected Kura app directory when it exists.
          for PUBSPEC in "${PUBSPEC_FILES[@]}"; do
            DIR="$(dirname "$PUBSPEC")"

            if [ -f "$DIR/android/app/build.gradle" ] || \
               [ -f "$DIR/android/app/build.gradle.kts" ]; then

              case "$DIR" in
                *kura_collect_flutter*|*kura_collect*|*kura*)
                  FLUTTER_DIR="$DIR"
                  break
                  ;;
              esac
            fi
          done

          # Otherwise use the first valid Flutter Android project.
          if [ -z "$FLUTTER_DIR" ]; then
            for PUBSPEC in "${PUBSPEC_FILES[@]}"; do
              DIR="$(dirname "$PUBSPEC")"

              if [ -d "$DIR/lib" ] && \
                 [ -d "$DIR/android" ] && \
                 { [ -f "$DIR/android/app/build.gradle" ] || \
                   [ -f "$DIR/android/app/build.gradle.kts" ]; }; then
                FLUTTER_DIR="$DIR"
                break
              fi
            done
          fi

          if [ -z "$FLUTTER_DIR" ]; then
            echo "::error::A pubspec.yaml file was found, but no valid Flutter Android project was detected."
            echo
            echo "Expected files:"
            echo "  pubspec.yaml"
            echo "  lib/"
            echo "  android/"
            echo "  android/app/build.gradle or build.gradle.kts"
            exit 1
          fi

          RELATIVE_DIR="${FLUTTER_DIR#"$GITHUB_WORKSPACE"/}"

          echo
          echo "Flutter project found at:"
          echo "$RELATIVE_DIR"

          echo "flutter_dir=$FLUTTER_DIR" >> "$GITHUB_OUTPUT"
          echo "flutter_relative_dir=$RELATIVE_DIR" >> "$GITHUB_OUTPUT"

      - name: Display Flutter project structure
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        run: |
          echo "Working directory:"
          pwd

          echo
          echo "Project contents:"
          ls -la

          echo
          echo "Android directory:"
          find android -maxdepth 3 -type f | sort | head -200

      - name: Configure production domain
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        shell: bash
        run: |
          echo "Production domain: https://nokknock.app"

          # This does not modify source files. It exposes the domain during
          # compilation for code that reads it with String.fromEnvironment.
          echo "KURA_BASE_URL=https://nokknock.app" >> "$GITHUB_ENV"

      - name: Get Flutter dependencies
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        run: flutter pub get

      - name: Check Flutter project
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        run: flutter doctor -v

      - name: Run code analysis
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        continue-on-error: true
        run: |
          if [ -d test ] && find test -type f -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      - name: Build release APK
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        run: |
          flutter build apk \
            --release \
            --dart-define=KURA_BASE_URL=https://nokknock.app

      - name: Build release Android App Bundle
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=KURA_BASE_URL=https://nokknock.app

      - name: Verify build files
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not created at $APK_PATH"
            exit 1
          fi

          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::AAB was not created at $AAB_PATH"
            exit 1
          fi

          echo "Build files created successfully:"
          ls -lh "$APK_PATH"
          ls -lh "$AAB_PATH"

      - name: Prepare release files
        working-directory: ${{ steps.find_flutter.outputs.flutter_dir }}
        shell: bash
        run: |
          mkdir -p github-artifacts

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            github-artifacts/kura-collect-release.apk

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            github-artifacts/kura-collect-release.aab

          echo "Commit: $GITHUB_SHA" > github-artifacts/build-information.txt
          echo "Branch: $GITHUB_REF_NAME" >> github-artifacts/build-information.txt
          echo "Domain: https://nokknock.app" >> github-artifacts/build-information.txt
          echo "Flutter project: ${{ steps.find_flutter.outputs.flutter_relative_dir }}" \
            >> github-artifacts/build-information.txt

          sha256sum \
            github-artifacts/kura-collect-release.apk \
            github-artifacts/kura-collect-release.aab \
            > github-artifacts/SHA256SUMS.txt

          ls -lh github-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kura-collect-apk
          path: |
            ${{ steps.find_flutter.outputs.flutter_dir }}/github-artifacts/kura-collect-release.apk
            ${{ steps.find_flutter.outputs.flutter_dir }}/github-artifacts/SHA256SUMS.txt
            ${{ steps.find_flutter.outputs.flutter_dir }}/github-artifacts/build-information.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kura-collect-aab
          path: |
            ${{ steps.find_flutter.outputs.flutter_dir }}/github-artifacts/kura-collect-release.aab
            ${{ steps.find_flutter.outputs.flutter_dir }}/github-artifacts/SHA256SUMS.txt
            ${{ steps.find_flutter.outputs.flutter_dir }}/github-artifacts/build-information.txt
          if-no-files-found: error
          retention-days: 30
