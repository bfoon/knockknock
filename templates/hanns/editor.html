{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ deck.title }} · Hanns studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Archivo:wght@400;500;600;700;800&family=Archivo+Expanded:wght@600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'hanns/css/hanns.css' %}?v=1">
</head>
<div class="app">

  <!-- ── Top bar ──────────────────────────────────────────────────── -->
  <header class="topbar">
    <a class="brand" href="{% url 'hanns:list' %}" title="Back to your decks">
      <span class="brand-mark">Hanns<span class="dot">.</span></span>
      <span class="brand-sub">studio</span>
    </a>
    <input class="file-name" id="deck-title" value="Untitled deck" maxlength="60" aria-label="Deck title">
    <div class="spacer"></div>

    <button class="tbtn ghost" id="btn-templates"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Templates</button>
    <button class="tbtn ghost" id="btn-save" data-state="saved"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5zM8 4v5h7M8 14h8"/></svg> <span class="save-lbl">Saved</span></button>
    <button class="tbtn primary" id="btn-present"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 4 14 8-14 8z"/></svg> Present</button>
  </header>

  <!-- ── Workspace ────────────────────────────────────────────────── -->
  <div class="work" id="work">

    <!-- Tool rail -->
    <nav class="rail" id="rail">
      <button class="tool" data-add="text" title="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5h16v2M9 5v14M9 19h6"/></svg><span class="lbl">Text</span></button>
      <button class="tool" data-add="image" title="Image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 17-5-5-7 7"/></svg><span class="lbl">Image</span></button>
      <button class="tool" data-add="rect" title="Shape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><span class="lbl">Shape</span></button>
      <button class="tool" data-add="ellipse" title="Circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg><span class="lbl">Circle</span></button>
      <button class="tool" data-add="line" title="Line / divider"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/></svg><span class="lbl">Divider</span></button>
      <div class="sep"></div>
      <button class="tool" id="rail-bg" title="Backgrounds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8c4-4 6 4 9 0s5-4 9 0M3 16c4-4 6 4 9 0s5-4 9 0"/></svg><span class="lbl">Backgrounds</span></button>
      <button class="tool" id="rail-tpl" title="Templates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">Templates</span></button>
    </nav>

    <!-- Filmstrip -->
    <aside class="filmstrip">
      <div class="filmstrip-head"><span>Slides</span><button id="add-slide" title="Add slide">+</button></div>
      <div class="slides" id="slides"></div>
    </aside>

    <!-- Canvas stage -->
    <section class="stage" id="stage">
      <div class="stage-grain"></div>

      <!-- drawers anchored to the rail -->
      <div class="drawer" id="drawer-tpl">
        <div class="drawer-head"><h3>Start from a template</h3><button class="x" data-close-drawer>✕</button></div>
        <div class="drawer-body"><div class="tpl-grid" id="tpl-grid"></div></div>
      </div>
      <div class="drawer" id="drawer-bg">
        <div class="drawer-head"><h3>Backgrounds</h3><button class="x" data-close-drawer>✕</button></div>
        <div class="drawer-body"><div class="bg-grid" id="bg-grid"></div></div>
      </div>

      <div class="canvas-wrap" id="canvas-wrap">
        <div class="canvas" id="canvas"></div>
      </div>

      <div class="slidenav">
        <button id="nav-prev" title="Previous">‹</button>
        <span class="pos" id="nav-pos">1 / 1</span>
        <button id="nav-next" title="Next">›</button>
      </div>
      <div class="zoombar">
        <button id="zoom-out">−</button>
        <span id="zoom-val">Fit</span>
        <button id="zoom-in">+</button>
      </div>
    </section>

    <!-- Inspector -->
    <aside class="inspector" id="inspector">
      <div class="insp-tabs">
        <button class="insp-tab active" data-tab="element">Element</button>
        <button class="insp-tab" data-tab="animate">Animate</button>
        <button class="insp-tab" data-tab="slide">Slide</button>
      </div>
      <div class="insp-body" id="insp-body"></div>
    </aside>

  </div>
</div>

<input type="file" id="img-input" accept="image/*" class="hidden">
<div class="toast" id="toast"></div>


<script>
/* ════════════════════════════════════════════════════════════════════
   HANNS — application logic
   A single-file editorial presentation studio: slide editor, template &
   background galleries, per-element animation, live present mode with a
   QR + floating audience-emoji reactions.

   PORTING NOTE (KnockKnock / Django):
   The present-mode audience loop here is simulated locally so it runs in
   one file with no server. To go live, replace `Live.*` with a WebSocket
   to a Channels consumer (mirror Boardly's BoardConsumer): the presenter
   opens ws/hanns/<CODE>/, audience phones POST {type:"react", emoji} and
   the consumer fans out {type:"reaction", emoji} → spawnEmoji(). Slide
   sync is just {type:"goto", index}. Everything else is presentational.
   ════════════════════════════════════════════════════════════════════ */
(function(){
"use strict";

const W = 960, H = 540;     // slide design size (16:9), all coords are in this space
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ── palette presented in colour pickers ─────────────────────────── */
const PALETTE = ["#16140f","#3a352a","#6b6354","#a59c88","#f6f1e7","#ffffff",
  "#e8482b","#ff6a4d","#d8a23a","#f2c14e","#2f6f4f","#5b8c5a",
  "#1d4e89","#3b82a0","#7d4f9c","#b15fa3"];

/* ── animation catalogue (entrance) ──────────────────────────────── */
const ANIMS = {
  none:     {label:"None"},
  fade:     {label:"Fade in"},
  "rise":   {label:"Rise up"},
  "drop":   {label:"Drop down"},
  "left":   {label:"Slide from left"},
  "right":  {label:"Slide from right"},
  "zoom":   {label:"Zoom in"},
  "pop":    {label:"Pop"},
  "blur":   {label:"Focus / unblur"},
  "reveal": {label:"Wipe reveal"},
};
const TRANSITIONS = {
  none:"None", fade:"Fade", slide:"Slide", push:"Push",
  zoom:"Zoom", flip:"Flip", reveal:"Reveal"
};

/* ── background library (CSS backgrounds = magazine-grade, exportable) ─ */
const BACKGROUNDS = [
  {name:"Paper",      css:"#f6f1e7"},
  {name:"Ink",        css:"#16140f"},
  {name:"Bone",       css:"#fbf8f1"},
  {name:"Ember",      css:"linear-gradient(135deg,#e8482b,#7a1f12)"},
  {name:"Dusk",       css:"linear-gradient(160deg,#1d2440,#3b2a52 55%,#7d4f9c)"},
  {name:"Sahara",     css:"linear-gradient(150deg,#f2c14e,#d8732a 70%,#9a3b1f)"},
  {name:"Pine",       css:"linear-gradient(160deg,#0f2a22,#2f6f4f)"},
  {name:"Cobalt",     css:"linear-gradient(150deg,#0b1d3a,#1d4e89 60%,#3b82a0)"},
  {name:"Mesh Coral", css:"radial-gradient(60% 80% at 20% 20%,#ff6a4d 0%,transparent 60%),radial-gradient(50% 70% at 85% 30%,#d8a23a 0%,transparent 55%),radial-gradient(70% 80% at 60% 100%,#7d4f9c 0%,transparent 60%),#1a1712"},
  {name:"Mesh Mint",  css:"radial-gradient(60% 80% at 15% 25%,#5b8c5a 0%,transparent 60%),radial-gradient(55% 70% at 90% 20%,#3b82a0 0%,transparent 55%),radial-gradient(80% 80% at 50% 110%,#1d4e89 0%,transparent 60%),#0d1410"},
  {name:"Grid",       css:"linear-gradient(#e9e0cf 1px,transparent 1px),linear-gradient(90deg,#e9e0cf 1px,transparent 1px),#f6f1e7", size:"32px 32px"},
  {name:"Dots",       css:"radial-gradient(#c9bfa6 1.4px,transparent 1.5px),#f6f1e7", size:"22px 22px"},
  {name:"Stripes",    css:"repeating-linear-gradient(45deg,#16140f 0 14px,#211e18 14px 28px)"},
  {name:"Halftone",   css:"radial-gradient(#e8482b 22%,transparent 23%),#16140f", size:"18px 18px"},
  {name:"Sunburst",   css:"repeating-conic-gradient(from 0deg at 50% 120%,#f2c14e 0deg 6deg,#e8842b 6deg 12deg)"},
  {name:"Aurora",     css:"linear-gradient(120deg,#0b1d3a,#2f6f4f 40%,#7d4f9c 75%,#e8482b)"},
];

/* ── text style presets used in templates & the text tool ────────── */
const FONTS = [
  {label:"Fraunces (display)", css:'"Fraunces",serif'},
  {label:"Archivo Expanded",   css:'"Archivo Expanded","Archivo",sans-serif'},
  {label:"Archivo",            css:'"Archivo",sans-serif'},
  {label:"Spline Mono",        css:'"Spline Sans Mono",monospace'},
];

/* ════════════════════════════════════════════════════════════════════
   ELEMENT FACTORIES — every element is a plain data object.
   types: text | rect | ellipse | line | image
   common: {id,type,x,y,w,h,rot,anim,animDelay}
   ════════════════════════════════════════════════════════════════════ */
function elBase(type,over={}){
  return Object.assign({
    id:uid(), type, x:120,y:120,w:300,h:120,rot:0,
    anim:"fade", animDelay:0,
  },over);
}
function makeText(over={}){
  return elBase("text",Object.assign({
    w:420,h:120,text:"Double-click to edit",
    font:'"Fraunces",serif', size:44, weight:600, italic:false,
    color:"#16140f", align:"left", lh:1.1, ls:0, fill:"none",
  },over));
}
function makeShape(type,over={}){
  return elBase(type,Object.assign({
    w:220,h:220, fill:"#e8482b", stroke:"none", strokeW:0, radius:14,
  },over));
}
function makeLine(over={}){
  return elBase("line",Object.assign({w:360,h:6,fill:"#16140f"},over));
}
function makeImage(src,over={}){
  return elBase("image",Object.assign({w:360,h:240,src:src||"",fit:"cover",radius:12},over));
}

/* ════════════════════════════════════════════════════════════════════
   TEMPLATES — each is {name, build()->{bg,bgSize,els[]}}.
   Designed to look editorial / magazine out of the box.
   ════════════════════════════════════════════════════════════════════ */
function T_titleEmber(){return{bg:BACKGROUNDS[3].css,els:[
  makeText({x:90,y:150,w:780,h:170,text:"The Big Idea",font:'"Fraunces",serif',size:118,weight:600,italic:true,color:"#fbf8f1",anim:"rise"}),
  makeShape("rect",{x:92,y:330,w:120,h:8,fill:"#f2c14e",anim:"left",animDelay:.2,radius:4}),
  makeText({x:92,y:352,w:680,h:60,text:"A subtitle that sets the tone",size:30,weight:400,color:"#ffd9cf",anim:"fade",animDelay:.35,font:'"Archivo",sans-serif'}),
  makeText({x:92,y:470,w:400,h:40,text:"YOUR NAME · 2025",size:16,weight:700,color:"#ffb9a8",ls:3,font:'"Spline Sans Mono",monospace',anim:"fade",animDelay:.5}),
]};}
function T_titleBone(){return{bg:BACKGROUNDS[2].css,els:[
  makeText({x:90,y:120,w:300,h:40,text:"CHAPTER 01",size:18,weight:800,ls:6,color:"#e8482b",font:'"Archivo Expanded","Archivo",sans-serif',anim:"left"}),
  makeText({x:88,y:170,w:800,h:220,text:"A headline\nset in serif",font:'"Fraunces",serif',size:104,weight:600,color:"#16140f",lh:.98,anim:"rise",animDelay:.1}),
  makeShape("rect",{x:90,y:410,w:780,h:3,fill:"#16140f",anim:"reveal",animDelay:.35}),
  makeText({x:90,y:428,w:780,h:60,text:"Supporting line of context that frames the whole talk.",size:22,color:"#3a352a",font:'"Archivo",sans-serif',anim:"fade",animDelay:.45}),
]};}
function T_sectionDusk(){return{bg:BACKGROUNDS[4].css,els:[
  makeShape("ellipse",{x:560,y:-120,w:520,h:520,fill:"#e8482b",anim:"zoom"}),
  makeText({x:90,y:200,w:560,h:60,text:"SECTION",size:18,weight:800,ls:8,color:"#cdbce6",font:'"Spline Sans Mono",monospace',anim:"left"}),
  makeText({x:88,y:240,w:620,h:180,text:"Where we\nare going",font:'"Fraunces",serif',size:92,weight:500,italic:true,color:"#fbf8f1",lh:1,anim:"rise",animDelay:.15}),
]};}
function T_statement(){return{bg:BACKGROUNDS[1].css,els:[
  makeText({x:120,y:150,w:720,h:260,text:"“Make it\nunforgettable.”",font:'"Fraunces",serif',size:96,weight:600,italic:true,color:"#f6f1e7",lh:1.02,align:"center",anim:"blur"}),
  makeText({x:120,y:430,w:720,h:40,text:"— Hanns",size:20,weight:600,color:"#d8a23a",align:"center",font:'"Archivo",sans-serif',anim:"fade",animDelay:.4}),
]};}
function T_twoCol(){return{bg:BACKGROUNDS[0].css,els:[
  makeText({x:80,y:90,w:800,h:80,text:"Two columns",font:'"Fraunces",serif',size:60,weight:600,color:"#16140f",anim:"rise"}),
  makeShape("rect",{x:80,y:190,w:380,h:280,fill:"#16140f",radius:16,anim:"left",animDelay:.1}),
  makeText({x:104,y:214,w:332,h:60,text:"Point one",size:30,weight:700,color:"#f6f1e7",font:'"Archivo",sans-serif',anim:"fade",animDelay:.25}),
  makeText({x:104,y:268,w:332,h:180,text:"Describe the first idea here with a sentence or two of supporting detail.",size:19,color:"#cfc6b2",font:'"Archivo",sans-serif',lh:1.4,anim:"fade",animDelay:.3}),
  makeShape("rect",{x:500,y:190,w:380,h:280,fill:"#e8482b",radius:16,anim:"right",animDelay:.1}),
  makeText({x:524,y:214,w:332,h:60,text:"Point two",size:30,weight:700,color:"#fff",font:'"Archivo",sans-serif',anim:"fade",animDelay:.35}),
  makeText({x:524,y:268,w:332,h:180,text:"And the second idea, balanced against the first for visual rhythm.",size:19,color:"#ffe2d9",font:'"Archivo",sans-serif',lh:1.4,anim:"fade",animDelay:.4}),
]};}
function T_imageLeft(){return{bg:BACKGROUNDS[2].css,els:[
  makeImage("",{x:0,y:0,w:430,h:540,radius:0,anim:"left"}),
  makeText({x:480,y:130,w:400,h:40,text:"FEATURE",size:16,weight:800,ls:6,color:"#e8482b",font:'"Spline Sans Mono",monospace',anim:"fade",animDelay:.2}),
  makeText({x:478,y:168,w:420,h:160,text:"A picture\nand a point",font:'"Fraunces",serif',size:64,weight:600,color:"#16140f",lh:1,anim:"rise",animDelay:.25}),
  makeText({x:480,y:350,w:400,h:120,text:"Pair an image with a clear, confident caption to carry the idea.",size:20,color:"#3a352a",font:'"Archivo",sans-serif',lh:1.45,anim:"fade",animDelay:.4}),
]};}
function T_bigNumber(){return{bg:BACKGROUNDS[9].css,els:[
  makeText({x:90,y:120,w:780,h:280,text:"87%",font:'"Archivo Expanded","Archivo",sans-serif',size:240,weight:800,color:"#fbf8f1",anim:"pop"}),
  makeText({x:96,y:400,w:780,h:80,text:"of presentations are forgotten. Yours won't be.",size:28,color:"#cfe7d8",font:'"Archivo",sans-serif',anim:"fade",animDelay:.3}),
]};}
function T_thanks(){return{bg:BACKGROUNDS[8].css,els:[
  makeText({x:120,y:190,w:720,h:160,text:"Thank you",font:'"Fraunces",serif',size:108,weight:600,italic:true,color:"#fbf8f1",align:"center",anim:"zoom"}),
  makeText({x:120,y:360,w:720,h:40,text:"hello@yourbrand.com",size:22,color:"#ffd9cf",align:"center",font:'"Spline Sans Mono",monospace',anim:"fade",animDelay:.3}),
]};}

const TEMPLATES = [
  {name:"Title · Ember",   build:T_titleEmber},
  {name:"Title · Serif",   build:T_titleBone},
  {name:"Section · Dusk",  build:T_sectionDusk},
  {name:"Statement",       build:T_statement},
  {name:"Two columns",     build:T_twoCol},
  {name:"Image + point",   build:T_imageLeft},
  {name:"Big number",      build:T_bigNumber},
  {name:"Thank you",       build:T_thanks},
];

/* ════════════════════════════════════════════════════════════════════
   DECK STATE
   ════════════════════════════════════════════════════════════════════ */
const Deck = {
  title:"Untitled deck",
  slides:[],            // [{id,bg,bgSize,transition,els:[]}]
  cur:0,
  sel:null,             // selected element id
  code: genCode(),
};
function genCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=a[Math.random()*a.length|0];return s;}
function newSlide(over={}){return Object.assign({id:uid(),bg:BACKGROUNDS[0].css,bgSize:null,transition:"fade",els:[]},over);}
function curSlide(){return Deck.slides[Deck.cur];}
function selEl(){const s=curSlide();return s?s.els.find(e=>e.id===Deck.sel):null;}

/* ════════════════════════════════════════════════════════════════════
   RENDER — build the DOM for an element. Shared by editor + present +
   thumbnails, so a slide always looks identical everywhere.
   `live` true = presentation (run entrance animations), false = editor.
   ════════════════════════════════════════════════════════════════════ */
function styleEl(el,node){
  node.style.left=el.x+"px";node.style.top=el.y+"px";
  node.style.width=el.w+"px";node.style.height=el.h+"px";
  node.style.transform=`rotate(${el.rot||0}deg)`;
}
function renderElement(el,{live=false}={}){
  const node=document.createElement("div");
  node.className="el "+el.type;
  node.dataset.id=el.id;
  styleEl(el,node);
  const inner=document.createElement("div");inner.className="el-inner";

  if(el.type==="text"){
    const t=document.createElement("div");
    t.style.font=`${el.italic?"italic ":""}${el.weight} ${el.size}px/${el.lh} ${el.font}`;
    t.style.color=el.color;t.style.textAlign=el.align;t.style.letterSpacing=(el.ls||0)+"px";
    t.style.width="100%";t.style.whiteSpace="pre-wrap";
    if(el.fill&&el.fill!=="none"){node.style.background=el.fill;}
    t.textContent=el.text;
    if(!live){t.setAttribute("contenteditable","true");t.spellcheck=false;}
    inner.appendChild(t);
  } else if(el.type==="rect"||el.type==="ellipse"){
    const s=document.createElement("div");s.className="shape";
    s.style.background=el.fill;s.style.borderRadius=el.type==="ellipse"?"50%":(el.radius||0)+"px";
    if(el.stroke&&el.stroke!=="none"&&el.strokeW)s.style.border=`${el.strokeW}px solid ${el.stroke}`;
    inner.appendChild(s);
  } else if(el.type==="line"){
    const s=document.createElement("div");s.className="shape";
    s.style.background=el.fill;s.style.borderRadius="999px";
    inner.appendChild(s);
  } else if(el.type==="image"){
    const im=document.createElement("div");im.className="imgbox"+(el.src?"":" placeholder");
    if(el.src){im.style.backgroundImage=`url("${el.src}")`;im.style.backgroundSize=el.fit;}
    else im.textContent="🖼  click to add image";
    im.style.borderRadius=(el.radius||0)+"px";
    inner.appendChild(im);
  }
  node.appendChild(inner);

  if(!live){
    ["nw","ne","sw","se"].forEach(p=>{const h=document.createElement("div");h.className="handle "+p;h.dataset.handle=p;node.appendChild(h);});
    const r=document.createElement("div");r.className="rot";r.dataset.handle="rot";node.appendChild(r);
  }
  return node;
}

/* entrance animation keyframe application (present mode) */
function animateIn(node,el){
  const a=el.anim||"none";if(a==="none"){node.style.opacity=1;return;}
  const map={
    fade:[{opacity:0},{opacity:1}],
    rise:[{opacity:0,transform:`translateY(40px) rotate(${el.rot||0}deg)`},{opacity:1,transform:`translateY(0) rotate(${el.rot||0}deg)`}],
    drop:[{opacity:0,transform:`translateY(-40px) rotate(${el.rot||0}deg)`},{opacity:1,transform:`translateY(0) rotate(${el.rot||0}deg)`}],
    left:[{opacity:0,transform:`translateX(-60px) rotate(${el.rot||0}deg)`},{opacity:1,transform:`translateX(0) rotate(${el.rot||0}deg)`}],
    right:[{opacity:0,transform:`translateX(60px) rotate(${el.rot||0}deg)`},{opacity:1,transform:`translateX(0) rotate(${el.rot||0}deg)`}],
    zoom:[{opacity:0,transform:`scale(.6) rotate(${el.rot||0}deg)`},{opacity:1,transform:`scale(1) rotate(${el.rot||0}deg)`}],
    pop:[{opacity:0,transform:`scale(.3) rotate(${el.rot||0}deg)`},{opacity:1,transform:`scale(1.08) rotate(${el.rot||0}deg)`,offset:.7},{transform:`scale(1) rotate(${el.rot||0}deg)`,opacity:1}],
    blur:[{opacity:0,filter:"blur(14px)"},{opacity:1,filter:"blur(0)"}],
    reveal:[{opacity:0,clipPath:"inset(0 100% 0 0)"},{opacity:1,clipPath:"inset(0 0 0 0)"}],
  };
  const frames=map[a]||map.fade;
  node.style.opacity=0;
  node.animate(frames,{duration:a==="pop"?720:620,delay:(el.animDelay||0)*1000,
    easing:a==="pop"?"cubic-bezier(.34,1.56,.64,1)":"cubic-bezier(.22,1,.36,1)",fill:"both"});
}

/* paint a slide into a container at native 960×540 */
function paintSlide(container,slide,{live=false}={}){
  container.innerHTML="";
  container.style.background=slide.bg;
  if(slide.bgSize)container.style.backgroundSize=slide.bgSize;else container.style.backgroundSize="";
  slide.els.forEach(el=>{
    const node=renderElement(el,{live});
    container.appendChild(node);
    if(live)animateIn(node,el);
  });
}

/* ── zoom: fit the 960×540 canvas into the stage ─────────────────── */
function fitZoom(){

  if(kind==="text") el=makeText({x:cx,y:cy});

/* ════════════════════════════════════════════════════════════════════
   CANVAS interaction: select, drag, resize, rotate, inline text edit
   All maths happen in slide space (divide pointer deltas by zoom).
   ════════════════════════════════════════════════════════════════════ */
function wireCanvasElements(){
  $$(".el",canvas).forEach(node=>{
    const id=node.dataset.id;
    node.addEventListener("pointerdown",e=>{
      if(e.target.closest("[data-handle]"))return; // handled below
      if(e.target.isContentEditable&&node.classList.contains("selected"))return; // editing text
      selectEl(id);startDrag(e,node,id);
    });
    // image element: click placeholder to choose a file
    if(node.classList.contains("image")){
      node.addEventListener("dblclick",()=>pickImageFor(id));
    }
    // text: dbl-click to edit, commit on blur
    const ce=node.querySelector("[contenteditable]");
    if(ce){
      node.addEventListener("dblclick",()=>{ce.focus();
        document.getSelection().selectAllChildren(ce);});
      ce.addEventListener("blur",()=>{const el=curSlide().els.find(x=>x.id===id);
        if(el){el.text=ce.innerText;renderFilmstrip();}});
      ce.addEventListener("pointerdown",e=>e.stopPropagation());
    }
    // handles
    $$("[data-handle]",node).forEach(h=>{
      h.addEventListener("pointerdown",e=>{e.stopPropagation();selectEl(id);
        if(h.dataset.handle==="rot")startRotate(e,node,id);
        else startResize(e,node,id,h.dataset.handle);});
    });
  });
}
function startDrag(e,node,id){
  const el=curSlide().els.find(x=>x.id===id);if(!el)return;
  const sx=e.clientX, sy=e.clientY, ox=el.x, oy=el.y;
  const mv=ev=>{el.x=Math.round(ox+(ev.clientX-sx)/zoom);el.y=Math.round(oy+(ev.clientY-sy)/zoom);
    node.style.left=el.x+"px";node.style.top=el.y+"px";};
  const up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);renderFilmstrip();syncInspectorPos();};
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
}
function startResize(e,node,id,corner){
  const el=curSlide().els.find(x=>x.id===id);if(!el)return;
  const sx=e.clientX, sy=e.clientY;
  const o={x:el.x,y:el.y,w:el.w,h:el.h};
  const mv=ev=>{
    const dx=(ev.clientX-sx)/zoom, dy=(ev.clientY-sy)/zoom;
    let {x,y,w,h}=o;
    if(corner.includes("e"))w=Math.max(20,o.w+dx);
    if(corner.includes("s"))h=Math.max(12,o.h+dy);
    if(corner.includes("w")){w=Math.max(20,o.w-dx);x=o.x+dx;}
    if(corner.includes("n")){h=Math.max(12,o.h-dy);y=o.y+dy;}
    el.x=Math.round(x);el.y=Math.round(y);el.w=Math.round(w);el.h=Math.round(h);
    node.style.left=el.x+"px";node.style.top=el.y+"px";
    node.style.width=el.w+"px";node.style.height=el.h+"px";
  };
  const up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);renderFilmstrip();syncInspectorPos();};
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
}
function startRotate(e,node,id){
  const el=curSlide().els.find(x=>x.id===id);if(!el)return;
  const r=node.getBoundingClientRect();const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const mv=ev=>{let a=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90;
    if(ev.shiftKey)a=Math.round(a/15)*15;el.rot=Math.round(a);
    node.style.transform=`rotate(${el.rot}deg)`;};
  const up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);renderInspector();};
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
}

    const mini=document.createElement("div");mini.className="mini";mini.style.width=W+"px";mini.style.height=H+"px";
    const built=tpl.build();paintSlide(mini,Object.assign(newSlide(),{bg:built.bg,bgSize:built.bgSize,els:built.els}),{live:false});
    requestAnimationFrame(()=>{mini.style.transform=`scale(${card.clientWidth/W})`;});
    card.appendChild(mini);
    card.addEventListener("click",()=>applyTemplate(tpl));
    g.appendChild(card);
  });
}
function buildBgGallery(){
  const g=$("#bg-grid");g.innerHTML="";
  BACKGROUNDS.forEach((b,i)=>{const cell=document.createElement("div");cell.className="bg-cell";
    cell.style.background=b.css;if(b.size)cell.style.backgroundSize=b.size;
    cell.innerHTML=`<span class="bgn">${b.name}</span>`;
    cell.addEventListener("click",()=>{const s=curSlide();s.bg=b.css;s.bgSize=b.size||null;renderAll();});
    g.appendChild(cell);});
}
function openDrawer(which){closeDrawers();$("#drawer-"+which).classList.add("open");
  $("#rail-tpl").classList.toggle("active",which==="tpl");$("#rail-bg").classList.toggle("active",which==="bg");}
function closeDrawers(){$$(".drawer").forEach(d=>d.classList.remove("open"));
  $("#rail-tpl").classList.remove("active");$("#rail-bg").classList.remove("active");}

/* ════════════════════════════════════════════════════════════════════
   PRESENT MODE  +  live audience emoji
   ════════════════════════════════════════════════════════════════════ */
const REACTIONS=["❤️","👏","🔥","😂","😮","💯","🎉","👍","✨","🙌","🤯","💜"];
const present   = $("#present");
const pCanvas   = $("#present-canvas");
const emojiLayer= $("#emoji-layer");
let pIndex=0;

function fitPresentCanvas(){
  const pad=0;const aw=window.innerWidth-pad, ah=window.innerHeight-pad;
  const z=Math.min(aw/W, ah/H);
  pCanvas.style.width=W+"px";pCanvas.style.height=H+"px";
  pCanvas.style.transform=`scale(${z})`;pCanvas.style.transformOrigin="center center";
}
function presentTransition(node,kind){
  const map={
    none:[{opacity:1}],
    fade:[{opacity:0},{opacity:1}],
    slide:[{transform:"translateX(60px)",opacity:0},{transform:"translateX(0)",opacity:1}],
    push:[{transform:"translateX(100%)"},{transform:"translateX(0)"}],
    zoom:[{transform:"scale(1.08)",opacity:0},{transform:"scale(1)",opacity:1}],
    flip:[{transform:"perspective(1200px) rotateY(12deg)",opacity:0},{transform:"perspective(1200px) rotateY(0)",opacity:1}],
    reveal:[{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0 0)"}],
  };
  node.animate(map[kind]||map.fade,{duration:480,easing:"cubic-bezier(.22,1,.36,1)",fill:"both"});
}
function showPresentSlide(i){
  pIndex=clamp(i,0,Deck.slides.length-1);
  const s=Deck.slides[pIndex];
  paintSlide(pCanvas,s,{live:true});
  presentTransition(pCanvas,s.transition||"fade");
  $("#pp-pos").textContent=`${pIndex+1} / ${Deck.slides.length}`;
  Live.goto(pIndex);
}
function enterPresent(){
  present.classList.add("on");
  document.body.style.overflow="hidden";
  $("#present-code").textContent=Deck.code;
  $("#sim-code").textContent=Deck.code;
  $("#sim-title").textContent=Deck.title;
  $("#present-url").textContent="hanns.live/"+Deck.code.toLowerCase();
  drawPresentQR();
  buildReactionPad();
  fitPresentCanvas();
  showPresentSlide(Deck.cur);
  Live.start(Deck.code);
}
function exitPresent(){present.classList.remove("on");document.body.style.overflow="";Live.stop();}
function drawPresentQR(){
  const box=$("#present-qr");box.innerHTML="";
  if(typeof QRCode==="undefined")return;
  new QRCode(box,{text:"https://hanns.live/"+Deck.code.toLowerCase(),width:84,height:84,
    colorDark:"#16140f",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function buildReactionPad(){
  const g=$("#react-grid");g.innerHTML="";
  REACTIONS.forEach(em=>{const b=document.createElement("button");b.className="react";b.textContent=em;
    b.addEventListener("click",()=>Live.react(em));g.appendChild(b);});
}
function spawnEmoji(em){
  const e=document.createElement("div");e.className="emoji-fly";e.textContent=em;
  e.style.left=(8+Math.random()*84)+"%";
  e.style.setProperty("--spin",(Math.random()*40-20)+"deg");
  e.style.fontSize=(2+Math.random()*1.6)+"rem";
  emojiLayer.appendChild(e);
  setTimeout(()=>e.remove(),3700);
}

/* ── Live: local stand-in for the WebSocket layer ─────────────────────
   Replace these four methods with a real socket to go multi-device.
   start(code): open ws/hanns/<code>/ ; presenter_hello
   react(em):   send {type:"react",emoji} (or, here, echo locally)
   goto(i):     send {type:"goto",index:i}
   stop():      close
   Incoming {type:"reaction",emoji} → spawnEmoji(emoji).               */
const Live={
  _demo:null,
  start(code){
    // Demo heartbeat so you can SEE reactions flowing from "the audience".
    this.stop();
    this._demo=setInterval(()=>{
      if(Math.random()<0.7) spawnEmoji(REACTIONS[Math.random()*REACTIONS.length|0]);
    },900);
  },
  react(em){ spawnEmoji(em); /* + socket.send({type:"react",emoji:em}) */ },
  goto(i){ /* socket.send({type:"goto",index:i}) */ },
  stop(){ if(this._demo){clearInterval(this._demo);this._demo=null;} },
};

/* ════════════════════════════════════════════════════════════════════
   EXPORT (save / standalone html)
   ════════════════════════════════════════════════════════════════════ */
function download(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportJSON(){
  const data=JSON.stringify({title:Deck.title,slides:Deck.slides,code:Deck.code},null,2);
  download((Deck.title||"deck").replace(/\s+/g,"_")+".hanns",new Blob([data],{type:"application/json"}));
  toast("Saved .hanns file");
}
function exportStandaloneHTML(){
  // A tiny self-running viewer with the deck embedded — opens in any browser.
  const deck=JSON.stringify({title:Deck.title,slides:Deck.slides});
  const html=STANDALONE_VIEWER.replace("/*__DECK__*/","window.__DECK__="+deck+";");
  download((Deck.title||"deck").replace(/\s+/g,"_")+".html",new Blob([html],{type:"text/html"}));
  toast("Exported standalone HTML");
}

/* ════════════════════════════════════════════════════════════════════
   WIRING
   ════════════════════════════════════════════════════════════════════ */
function init(){
  // seed: one title slide from a template so it never opens blank
  Deck.slides=[Object.assign(newSlide(),(()=>{const b=TEMPLATES[0].build();return{bg:b.bg,bgSize:b.bgSize||null,transition:"fade",els:b.els};})())];
  Deck.cur=0;

  // rail add buttons
  $$(".rail .tool[data-add]").forEach(b=>b.addEventListener("click",()=>addElement(b.dataset.add)));
  $("#rail-tpl").addEventListener("click",()=>{const open=$("#drawer-tpl").classList.contains("open");open?closeDrawers():openDrawer("tpl");});
  $("#rail-bg").addEventListener("click",()=>{const open=$("#drawer-bg").classList.contains("open");open?closeDrawers():openDrawer("bg");});
  $$("[data-close-drawer]").forEach(b=>b.addEventListener("click",closeDrawers));
  $("#btn-templates").addEventListener("click",()=>openDrawer("tpl"));

  // filmstrip
  $("#add-slide").addEventListener("click",()=>addSlide());
  $("#nav-prev").addEventListener("click",()=>gotoSlide(Deck.cur-1));
  $("#nav-next").addEventListener("click",()=>gotoSlide(Deck.cur+1));

  // inspector tabs
  $$(".insp-tab").forEach(t=>t.addEventListener("click",()=>{inspTab=t.dataset.tab;renderInspector();}));

  // zoom
  $("#zoom-in").addEventListener("click",()=>{zoomMode=clamp((zoomMode==="fit"?fitZoom():zoom)+0.1,0.2,2);applyZoom();});
  $("#zoom-out").addEventListener("click",()=>{zoomMode=clamp((zoomMode==="fit"?fitZoom():zoom)-0.1,0.2,2);applyZoom();});
  $("#zoom-val").addEventListener("click",()=>{zoomMode="fit";applyZoom();});

  // title
  $("#deck-title").addEventListener("input",e=>{Deck.title=e.target.value||"Untitled deck";});
  $("#deck-title").value=Deck.title;

  // present
  $("#btn-present").addEventListener("click",enterPresent);
  $("#present-exit").addEventListener("click",exitPresent);
  $("#pp-prev").addEventListener("click",()=>showPresentSlide(pIndex-1));
  $("#pp-next").addEventListener("click",()=>showPresentSlide(pIndex+1));

  // export
  $("#btn-export").addEventListener("click",()=>{$("#export-deckname").textContent=Deck.title;$("#export-modal").classList.add("on");});
  $$("[data-close-modal]").forEach(b=>b.addEventListener("click",()=>$("#export-modal").classList.remove("on")));
  $("#export-json").addEventListener("click",()=>{exportJSON();$("#export-modal").classList.remove("on");});
  $("#export-html").addEventListener("click",()=>{exportStandaloneHTML();$("#export-modal").classList.remove("on");});

  // keyboard
  document.addEventListener("keydown",e=>{
    if(present.classList.contains("on")){
      if(e.key==="Escape")exitPresent();
      else if(e.key==="ArrowRight"||e.key===" ")showPresentSlide(pIndex+1);
      else if(e.key==="ArrowLeft")showPresentSlide(pIndex-1);
      return;
    }
    const tag=(e.target.tagName||"").toLowerCase();
    const editing=e.target.isContentEditable||tag==="input"||tag==="textarea";
    if(editing)return;
    if((e.key==="Delete"||e.key==="Backspace")&&Deck.sel){e.preventDefault();deleteEl(Deck.sel);}
    else if(e.key==="ArrowRight")gotoSlide(Deck.cur+1);
    else if(e.key==="ArrowLeft")gotoSlide(Deck.cur-1);
  });

  window.addEventListener("resize",()=>{applyZoom();if(present.classList.contains("on"))fitPresentCanvas();renderFilmstrip();});

  buildTplGallery();buildBgGallery();
  renderAll();
}

/* the standalone viewer template (kept as a string; deck injected on export) */
const STANDALONE_VIEWER = `<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanns deck</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Archivo:wght@400;500;600;700;800&family=Archivo+Expanded:wght@600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Archivo,sans-serif}
#st{position:fixed;inset:0;display:grid;place-items:center}
#cv{width:960px;height:540px;position:relative;overflow:hidden;transform-origin:center}
.el{position:absolute}.el-inner{width:100%;height:100%;position:relative}
.shape{width:100%;height:100%}.imgbox{width:100%;height:100%;background-size:cover;background-position:center}
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:.5rem;
background:rgba(20,18,14,.8);border:1px solid #333;border-radius:999px;padding:.4rem .6rem;z-index:5}
.nav button{background:0;border:0;color:#fff;font-size:1.1rem;cursor:pointer;width:30px;height:30px;border-radius:50%}
.nav button:hover{background:#fff2}.nav .p{color:#cfc6b2;font:.8rem 'Spline Sans Mono',monospace;padding:0 .4rem;align-self:center}
</style></head><body>
<div id="st"><div id="cv"></div></div>
<div class="nav"><button id="pv">‹</button><span class="p" id="po">1</span><button id="nx">›</button></div>
<script>/*__DECK__*/
var D=window.__DECK__,i=0,W=960,H=540,cv=document.getElementById("cv");
function paint(s,live){cv.innerHTML="";cv.style.background=s.bg;if(s.bgSize)cv.style.backgroundSize=s.bgSize;
 s.els.forEach(function(el){var n=document.createElement("div");n.className="el "+el.type;
  n.style.cssText="left:"+el.x+"px;top:"+el.y+"px;width:"+el.w+"px;height:"+el.h+"px;transform:rotate("+(el.rot||0)+"deg)";
  var inr=document.createElement("div");inr.className="el-inner";
  if(el.type==="text"){var t=document.createElement("div");
    t.style.cssText="width:100%;white-space:pre-wrap;font:"+(el.italic?"italic ":"")+el.weight+" "+el.size+"px/"+el.lh+" "+el.font+";color:"+el.color+";text-align:"+el.align+";letter-spacing:"+(el.ls||0)+"px";
    if(el.fill&&el.fill!=="none")n.style.background=el.fill;t.textContent=el.text;inr.appendChild(t);}
  else if(el.type==="rect"||el.type==="ellipse"){var sh=document.createElement("div");sh.className="shape";
    sh.style.background=el.fill;sh.style.borderRadius=el.type==="ellipse"?"50%":(el.radius||0)+"px";
    if(el.stroke&&el.stroke!=="none"&&el.strokeW)sh.style.border=el.strokeW+"px solid "+el.stroke;inr.appendChild(sh);}
  else if(el.type==="line"){var ln=document.createElement("div");ln.className="shape";ln.style.background=el.fill;ln.style.borderRadius="999px";inr.appendChild(ln);}
  else if(el.type==="image"){var im=document.createElement("div");im.className="imgbox";if(el.src){im.style.backgroundImage='url("'+el.src+'")';im.style.backgroundSize=el.fit;}im.style.borderRadius=(el.radius||0)+"px";inr.appendChild(im);}
  n.appendChild(inr);cv.appendChild(n);
  if(live&&el.anim&&el.anim!=="none"){var f={fade:[{opacity:0},{opacity:1}],rise:[{opacity:0,transform:"translateY(40px) rotate("+(el.rot||0)+"deg)"},{opacity:1,transform:"translateY(0) rotate("+(el.rot||0)+"deg)"}],drop:[{opacity:0,transform:"translateY(-40px)"},{opacity:1,transform:"translateY(0)"}],left:[{opacity:0,transform:"translateX(-60px)"},{opacity:1,transform:"translateX(0)"}],right:[{opacity:0,transform:"translateX(60px)"},{opacity:1,transform:"translateX(0)"}],zoom:[{opacity:0,transform:"scale(.6)"},{opacity:1,transform:"scale(1)"}],pop:[{opacity:0,transform:"scale(.3)"},{opacity:1,transform:"scale(1)"}],blur:[{opacity:0,filter:"blur(14px)"},{opacity:1,filter:"blur(0)"}],reveal:[{opacity:0,clipPath:"inset(0 100% 0 0)"},{opacity:1,clipPath:"inset(0 0 0 0)"}]};
   n.style.opacity=0;n.animate(f[el.anim]||f.fade,{duration:640,delay:(el.animDelay||0)*1000,easing:"cubic-bezier(.22,1,.36,1)",fill:"both"});}
 });}
function fit(){var z=Math.min(innerWidth/W,innerHeight/H);cv.style.transform="scale("+z+")";}
function go(n){i=Math.max(0,Math.min(n,D.slides.length-1));paint(D.slides[i],true);document.getElementById("po").textContent=(i+1)+" / "+D.slides.length;}
document.getElementById("nx").onclick=function(){go(i+1)};document.getElementById("pv").onclick=function(){go(i-1)};
addEventListener("keydown",function(e){if(e.key==="ArrowRight"||e.key===" ")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
addEventListener("resize",fit);fit();go(0);
<\/script>
