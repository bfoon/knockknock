{% extends "base.html" %}
{% block title %}Site settings{% endblock %}

{% block content %}
<div class="kk-venue-wrap">
  <a href="{% url 'attendance:venue_list' %}" class="kk-text-dim small text-decoration-none">
    <i class="bi bi-arrow-left"></i> Back to venues
  </a>
  <h1 class="mt-1 mb-3">Site settings</h1>

  <form method="post" class="kk-form-card" style="max-width: 480px;">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Default geofence radius (m)</label>
      {{ form.default_geofence_radius_m }}
      <div class="form-text">
        Applied to new venues when the creator doesn't pick one.
        Existing venues keep their saved radius.
      </div>
    </div>
    <button class="kk-btn kk-btn-primary" type="submit">
      <i class="bi bi-check2"></i> Save
    </button>
  </form>
</div>

<style>
.kk-venue-wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem; }
.kk-form-card {
  background: var(--kk-surface); border: 1px solid var(--kk-border);
  border-radius: var(--kk-radius); padding: 1.75rem;
}
</style>
{% endblock %}
