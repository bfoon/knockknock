{# Exposes the avatar catalog to JS as `window.kkAvatarsById`.
   Include this partial in play.html and present.html (or any page that
   shows avatar bubbles) BEFORE play.js / present.js. Requires:
     `avatars` — the AVATARS list from games.avatars.AVATARS
#}
{{ avatars|json_script:"kk-avatars-json" }}
<script>
(function () {
  try {
    const arr = JSON.parse(document.getElementById("kk-avatars-json").textContent);
    const byId = {};
    arr.forEach(a => { byId[a.id] = a; });
    window.kkAvatarsById = byId;
  } catch (e) {
    console.warn("[knock-knock] avatar catalog parse failed", e);
    window.kkAvatarsById = {};
  }
})();
</script>
