name: Build Kura Android

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "mobile/kura_collect_flutter/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile/kura_collect_flutter

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kura-collect-apk
          path: mobile/kura_collect_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kura-collect-aab
          path: mobile/kura_collect_flutter/build/app/outputs/bundle/release/app-release.aab