<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="generator" content="Kora · Kura (nokknock.app)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
{% if needs_map %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endif %}
<style>
  :root{
    --bg:#07081a; --panel:#10122c; --text:#f8fbff; --muted:#aeb7dc; --line:rgba(255,255,255,.12);
    --accent:#22d3ee; --warm:#ff8a1f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 "Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:28px 32px 8px;max-width:1400px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  header h1{margin:0;font:600 clamp(24px,3vw,36px)/1.15 "Fraunces",Georgia,serif;letter-spacing:-.01em;flex:1;min-width:260px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .grid{max-width:1400px;margin:0 auto;padding:16px 32px 48px;display:grid;grid-template-columns:repeat(12,1fr);
    grid-auto-rows:64px;gap:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;
    flex-direction:column;min-width:0;overflow:hidden}
  .tile h2{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--text)}
  .tile .cap{color:var(--muted);font-size:12.5px;margin-top:8px}
  .tile .body{flex:1;min-height:0;position:relative}
  .tile canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;height:100%}
  .card{display:flex;flex-direction:column;justify-content:center;gap:2px}
  .card .v{font:800 clamp(26px,3vw,40px)/1 "Archivo",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .card .l{color:var(--muted);font-size:13px}
  .card .h{color:var(--muted);font-size:12px;opacity:.8}
  .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .tbl{overflow:auto;height:100%}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .map{position:absolute;inset:0;border-radius:10px;overflow:hidden}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--c)}
  .shape{height:100%;display:flex;align-items:center;justify-content:center}
  .shape svg{width:100%;max-width:640px;max-height:100%}
  .text{white-space:pre-wrap;color:var(--text)}
  .err{color:#fca5a5;font-size:13px}
  footer{max-width:1400px;margin:0 auto;padding:0 32px 32px;color:var(--muted);font-size:12px}
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;grid-auto-rows:auto;padding:12px 16px 32px}
    .tile{grid-column:1/-1!important;grid-row:auto!important;min-height:280px}
    .tile.short{min-height:120px}
    header{padding:20px 16px 4px}
  }
  @media print{
    :root{--bg:#fff;--panel:#fff;--text:#111;--muted:#555;--line:#ddd}
    .tile{break-inside:avoid}
  }
</style>
</head>
<body>
<header>
  <h1 id="ttl"></h1>
  <p id="meta"></p>
</header>
<main class="grid" id="grid"></main>
<footer>Made with Kora, the AI assistant in Kura · numbers computed from the survey data at the time of export.</footer>

{{ payload|json_script:"kora-export" }}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
{% if needs_map %}<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endif %}
<script>
(function(){
"use strict";
const P = JSON.parse(document.getElementById("kora-export").textContent);
const root = document.documentElement.style;
const T = P.tokens || {};
if(!P.dark){ root.setProperty("--bg","#eef1f8"); root.setProperty("--panel","#fff"); root.setProperty("--text","#0b0e26");
  root.setProperty("--muted","#4a5378"); root.setProperty("--line","rgba(10,14,40,.12)"); }
Object.entries(T).forEach(([k,v])=>root.setProperty("--"+k, v));
const PAL = P.palette;
root.setProperty("--accent", PAL[0]);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = v=>{ if(v==null||v==="") return "—"; const n=Number(v); if(!isFinite(n)) return esc(v);
  return Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined,{maximumFractionDigits:1}); };
document.getElementById("ttl").textContent = P.title || "Dashboard";
document.getElementById("meta").textContent = (P.survey ? P.survey + " — " : "") + "exported " + P.generated;
document.title = P.title || document.title;

const cs = getComputedStyle(document.documentElement);
if(window.Chart){
  Chart.defaults.color = cs.getPropertyValue("--muted").trim() || "#aeb7dc";
  Chart.defaults.borderColor = cs.getPropertyValue("--line").trim() || "rgba(255,255,255,.12)";
  Chart.defaults.font.family = "Archivo, system-ui, sans-serif";
}

function chart(el, b){
  if(!window.Chart){ el.innerHTML = '<p class="err">Charts need an internet connection (Chart.js).</p>'; return; }
  const c = document.createElement("canvas"); el.appendChild(c);
  const t = b.chart;
  const type = t==="hbar"||t==="stacked" ? "bar" : t==="donut" ? "doughnut" : t==="area" ? "line" : t;
  const round = ["pie","doughnut","polarArea"].includes(type);
  const ds = (b.series||[]).map((s,i)=>({label:s.name, data:s.data,
    backgroundColor: round ? b.labels.map((_,j)=>PAL[j%PAL.length]) : PAL[i%PAL.length]+(type==="line"?"33":""),
    borderColor: round ? cs.getPropertyValue("--panel").trim() : PAL[i%PAL.length],
    borderWidth: round ? 2 : (type==="line"?2.5:0), fill: t==="area", tension:.35, pointRadius: type==="line"?0:3,
    borderRadius: type==="bar"?6:0}));
  new Chart(c, {type, data:{labels:b.labels, datasets:ds}, options:{responsive:true, maintainAspectRatio:false,
    indexAxis: t==="hbar" ? "y" : "x",
    plugins:{legend:{display: round || ds.length>1, position: round?"right":"top"}},
    scales: round||type==="radar" ? {} : {x:{stacked:t==="stacked", grid:{display:false}}, y:{stacked:t==="stacked", beginAtZero:true}}}});
}
function table(el, b){
  const cols = b.columns||[];
  const numeric = cols.map(c=>(b.rows||[]).slice(0,30).every(r=>r[c]==null||r[c]===""||isFinite(Number(r[c]))));
  el.innerHTML = '<div class="tbl"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+
    (b.rows||[]).map(r=>'<tr>'+cols.map((c,i)=>'<td class="'+(numeric[i]?"num":"")+'">'+(numeric[i]?fmt(r[c]):esc(r[c]))+'</td>').join("")+'</tr>').join("")+
    '</tbody></table></div>';
}
function cards(el, b){
  el.innerHTML = '<div class="cards">'+(b.cards||[]).map(c=>'<div class="card"><div class="v">'+
    (c.format==="percent" ? fmt(c.value)+"%" : fmt(c.value))+'</div><div class="l">'+esc(c.label)+'</div>'+
    (c.hint?'<div class="h">'+esc(c.hint)+'</div>':"")+
    (c.progress!=null?'<div class="bar"><i style="width:'+Math.min(100,c.progress)+'%"></i></div>':"")+'</div>').join("")+'</div>';
}
function map(el, b){
  if(!window.L){ el.innerHTML = '<p class="err">Maps need an internet connection (Leaflet).</p>'; return; }
  const box = document.createElement("div"); box.className="map"; el.appendChild(box);
  const m = L.map(box, {scrollWheelZoom:false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/"+(P.dark?"dark_all":"light_all")+"/{z}/{x}/{y}{r}.png",
    {attribution:"© OpenStreetMap © CARTO", maxZoom:19}).addTo(m);
  const groups = b.legend||[];
  const colour = g=>PAL[Math.max(0,groups.indexOf(g))%PAL.length];
  (b.points||[]).forEach(p=>L.circleMarker([p.lat,p.lng],{radius:5,weight:1,color:"#fff",fillColor:colour(p.group),fillOpacity:.85})
    .bindTooltip(p.group?esc(p.group):"").addTo(m));
  if(b.bounds) m.fitBounds(b.bounds,{padding:[20,20],maxZoom:14}); else m.setView([13.45,-15.4],8);
  if(groups.length){ const lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML = groups.map(g=>'<span style="--c:'+colour(g)+'">'+esc(g)+'</span>').join(""); el.parentNode.appendChild(lg); }
}
const ICONS = {
  person:'<circle cx="12" cy="6" r="4"/><path d="M4 22c0-5 3.6-8 8-8s8 3 8 8z"/>',
  home:'<path d="M3 11 12 3l9 8v10H3z"/>', drop:'<path d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/>',
  leaf:'<path d="M4 20C4 9 11 4 21 3c-1 10-6 17-17 17z"/>', star:'<path d="m12 2 3 7h7l-5.5 4.5 2 7.5L12 17l-6.5 4 2-7.5L2 9h7z"/>',
  heart:'<path d="M12 21s-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12z"/>'
};
function shape(el, b){
  const items = b.items||[]; const k = b.kind; const text = cs.getPropertyValue("--text").trim(); const mut = cs.getPropertyValue("--muted").trim();
  let svg = "";
  if(k==="pictogram"){
    // Same geometry as the chat renderer (kora.js shapeSVG): 10 icons per row, one row per item.
    const rows = items.slice(0,3); let out = "";
    rows.forEach((it,r)=>{
      const on = Math.round((it.pct||0)/10);
      for(let i=0;i<10;i++) out += '<g transform="translate('+(i*36)+' '+(r*62)+') scale(1.3)" fill="'+(i<on?PAL[r%PAL.length]:"rgba(127,127,127,.25)")+'">'+ICONS[b.icon||"person"]+'</g>';
      out += '<text x="0" y="'+(r*62+50)+'" fill="'+text+'" font-size="14" font-weight="700">'+esc(it.pct)+'% <tspan fill="'+mut+'" font-weight="500">'+esc(it.label)+'</tspan></text>';
    });
    svg = '<svg viewBox="0 0 360 '+(rows.length*62)+'">'+out+'</svg>';
  } else if(k==="funnel"){
    const max = Math.max(1,...items.map(i=>Number(i.value)||0)); const h=36;
    svg = '<svg viewBox="0 0 400 '+(items.length*(h+8))+'">'+items.map((it,i)=>{ const w = 120+280*(Number(it.value)||0)/max; const x=(400-w)/2;
      return '<rect x="'+x+'" y="'+(i*(h+8))+'" width="'+w+'" height="'+h+'" rx="10" fill="'+PAL[i%PAL.length]+'"/><text x="200" y="'+(i*(h+8)+23)+'" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">'+esc(it.label)+' · '+fmt(it.value)+(it.pct!=null?' ('+it.pct+'%)':'')+'</text>'; }).join("")+'</svg>';
  } else if(k==="bars" || k==="pill"){
    svg = '<svg viewBox="0 0 400 '+(items.length*42)+'">'+items.map((it,i)=>'<text x="0" y="'+(i*42+14)+'" fill="'+mut+'" font-size="12">'+esc(it.label)+'</text>'+
      '<rect x="0" y="'+(i*42+20)+'" width="340" height="12" rx="6" fill="rgba(127,127,127,.2)"/><rect x="0" y="'+(i*42+20)+'" width="'+(3.4*Math.min(100,it.pct||0))+'" height="12" rx="6" fill="'+PAL[i%PAL.length]+'"/>'+
      '<text x="400" y="'+(i*42+31)+'" text-anchor="end" fill="'+text+'" font-size="13" font-weight="700">'+(it.pct!=null?it.pct+'%':fmt(it.value))+'</text>').join("")+'</svg>';
  } else {
    const n = items.length, r=46, gap=130;
    svg = '<svg viewBox="0 0 '+Math.max(gap,n*gap)+' 150">'+items.map((it,i)=>{ const cx=i*gap+gap/2, c=2*Math.PI*r, p=Math.min(100,it.pct||0);
      const sweep = k==="gauge" ? .75 : 1;
      return '<circle cx="'+cx+'" cy="60" r="'+r+'" fill="none" stroke="rgba(127,127,127,.2)" stroke-width="11" stroke-dasharray="'+(c*sweep)+' '+c+'" transform="rotate('+(k==="gauge"?135:-90)+' '+cx+' 60)"/>'+
        '<circle cx="'+cx+'" cy="60" r="'+r+'" fill="none" stroke="'+PAL[i%PAL.length]+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(c*sweep*p/100)+' '+c+'" transform="rotate('+(k==="gauge"?135:-90)+' '+cx+' 60)"/>'+
        '<text x="'+cx+'" y="66" text-anchor="middle" fill="'+text+'" font-size="20" font-weight="800">'+(it.pct!=null?it.pct+'%':fmt(it.value))+'</text>'+
        '<text x="'+cx+'" y="132" text-anchor="middle" fill="'+mut+'" font-size="12">'+esc(String(it.label).slice(0,22))+'</text>'; }).join("")+'</svg>';
  }
  el.innerHTML = '<div class="shape">'+svg+'</div>';
}
function overview(el, b){
  el.innerHTML = '<div class="cards">'+(b.stats||[]).map(s=>'<div class="card"><div class="v">'+fmt(s.value)+'</div><div class="l">'+esc(s.label)+'</div></div>').join("")+'</div>'+
    '<p class="cap">'+(b.notes||[]).map(esc).join(" ")+'</p>';
}

const grid = document.getElementById("grid");
(P.items||[]).forEach(it=>{
  const b = it.block||{}; const tile = document.createElement("section"); tile.className="tile";
  tile.style.gridColumn = (it.x+1)+" / span "+it.w; tile.style.gridRow = (it.y+1)+" / span "+it.h;
  if(it.h<=2) tile.classList.add("short");
  if(b.title) tile.innerHTML = '<h2>'+esc(b.title)+'</h2>';
  const body = document.createElement("div"); body.className="body"; tile.appendChild(body); grid.appendChild(tile);
  try{
    ({chart, table, cards, map, shape, overview}[b.type] || ((el,bb)=>{ el.innerHTML = b.type==="text" ? '<div class="text">'+esc(bb.text)+'</div>' : '<p class="err">'+esc(bb.text||"Not available")+'</p>'; }))(body, b);
  }catch(e){ body.innerHTML = '<p class="err">Could not draw this card.</p>'; }
  if(b.caption){ const c=document.createElement("p"); c.className="cap"; c.textContent=b.caption; tile.appendChild(c); }
});
if(!(P.items||[]).some(it=>it.w<12)){
  grid.style.gridAutoRows = "auto";
  grid.querySelectorAll(".tile").forEach(t=>{ t.style.gridRow="auto"; t.style.minHeight = t.querySelector("canvas,.map")?"420px":"auto"; });
}
})();
</script>
</body>
</html>
