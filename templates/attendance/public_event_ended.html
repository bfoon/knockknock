{% extends "base.html" %}
{% block title %}Event ended · {{ event.title }}{% endblock %}
{% block content %}
<div class="kk-public-wrap">
  <div class="kk-public-card text-center">
    <div class="kk-empty">
      <div class="em">🔒</div>
      <h2 class="mb-2">This event has ended</h2>
      <p class="kk-text-dim mb-0">
        Registrations and check-ins are no longer accepted for {{ event.title }}.
      </p>
    </div>
  </div>
</div>

<style>
.kk-public-wrap {
  max-width: 540px; margin: 2rem auto;
  padding-left: 1rem;
  padding-right: 1rem;
}
.kk-public-card {
  background: var(--kk-surface); border: 1px solid var(--kk-border);
  border-radius: var(--kk-radius); padding: 1.75rem;
  max-width: 100%;
}
@media (max-width: 480px) {
  .kk-public-wrap {
    margin-top: 1rem;
    padding-left: .75rem;
    padding-right: .75rem;
  }
  .kk-public-card { padding: 1.25rem; }
}
</style>
{% endblock %}
